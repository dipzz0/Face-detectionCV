<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120f" />
      <stop offset="50%" stop-color="#070c0a" />
      <stop offset="100%" stop-color="#040705" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1" />
    </pattern>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="1200" height="360" fill="url(#bg)" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <circle cx="920" cy="180" r="230" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="358" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Left Column -->
  <g transform="translate(64, 0)">
    <g transform="translate(0, 52)">
      <rect width="254" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="font-mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">DEEP LEARNING • RETINAFACE</text>
    </g>

    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-sans" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        Face-DetectionCV
      </text>
    </g>

    <g transform="translate(0, 162)">
      <text x="0" y="0" class="font-sans" font-size="16.5" font-weight="400" fill="#94a3b8">
        Single-stage multi-scale human face detection with deep neural networks.
      </text>
      <text x="0" y="24" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
        Accurate localization under severe occlusions, varied angles, and lighting extremes.
      </text>
    </g>

    <!-- Specs Pills -->
    <g transform="translate(0, 246)">
      <g transform="translate(0, 0)">
        <rect width="118" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="59" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">Google Colab</text>
      </g>
      <g transform="translate(126, 0)">
        <rect width="128" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="64" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">RetinaFace FPN</text>
      </g>
      <g transform="translate(262, 0)">
        <rect width="110" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="55" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">OpenCV 4.x</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="138" height="30" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
        <text x="69" y="19" class="font-mono" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">5-Point Landmarks</text>
      </g>
    </g>

    <g transform="translate(0, 308)">
      <text x="0" y="0" class="font-mono" font-size="11" fill="#475569">Feature Pyramid Network • Robust to tiny faces • Zero manual tuning</text>
    </g>
  </g>

  <!-- Right Column: Minimalist Detection Card -->
  <g transform="translate(680, 42)">
    <rect width="456" height="276" rx="10" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
    
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 446 0 C 451.523 0 456 4.477 456 10 L 456 34 L 0 34 Z" fill="#0d131f" />
    <line x1="0" y1="34" x2="456" y2="34" stroke="#1e293b" stroke-width="1" />
    
    <circle cx="18" cy="17" r="4.5" fill="#ef4444" fill-opacity="0.75" />
    <circle cx="32" cy="17" r="4.5" fill="#f59e0b" fill-opacity="0.75" />
    <circle cx="46" cy="17" r="4.5" fill="#10b981" fill-opacity="0.75" />
    
    <text x="228" y="21" class="font-mono" font-size="10.5" font-weight="500" fill="#64748b" text-anchor="middle">retinaface.detect // multi_scale</text>

    <g transform="translate(24, 52)">
      <!-- Left Visual: Multi-Face Detection Viewer -->
      <g transform="translate(0, 0)">
        <rect width="210" height="186" rx="8" fill="#080c14" stroke="#172033" stroke-width="1" />
        
        <!-- Primary Face Detection Box -->
        <rect x="25" y="24" width="96" height="110" rx="3" fill="none" stroke="#10b981" stroke-width="2" />
        <rect x="25" y="10" width="68" height="14" rx="2" fill="#10b981" />
        <text x="29" y="20" class="font-mono" font-size="8.5" font-weight="700" fill="#040c08">FACE 99.4%</text>

        <!-- Secondary Face Detection Box (Background) -->
        <rect x="135" y="45" width="56" height="64" rx="3" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 3" />
        <text x="135" y="40" class="font-mono" font-size="8" font-weight="700" fill="#10b981">97.8%</text>

        <!-- Facial landmarks inside primary box -->
        <circle cx="58" cy="62" r="2.5" fill="#34d399" />
        <circle cx="86" cy="62" r="2.5" fill="#34d399" />
        <circle cx="72" cy="78" r="2" fill="#34d399" />
        <circle cx="62" cy="98" r="2" fill="#34d399" />
        <circle cx="82" cy="98" r="2" fill="#34d399" />

        <rect x="25" y="152" width="160" height="20" rx="4" fill="#061a12" stroke="#10b981" stroke-width="0.8" />
        <text x="105" y="166" class="font-mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">RETINAFACE: 2 FACES FOUND</text>
      </g>

      <!-- Right Telemetry Metrics -->
      <g transform="translate(226, 0)">
        <!-- Metric 1: Model -->
        <g transform="translate(0, 0)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">ARCHITECTURE</text>
          <text x="14" y="42" class="font-mono" font-size="12" font-weight="700" fill="#ffffff">RETINAFACE (SOTA)</text>
        </g>

        <!-- Metric 2: Resolution -->
        <g transform="translate(0, 64)">
          <rect width="182" height="54" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">FEATURE PYRAMID</text>
          <text x="14" y="42" class="font-mono" font-size="12" font-weight="700" fill="#34d399">MULTI-SCALE ANCHOR</text>
        </g>

        <!-- Metric 3: Confidence -->
        <g transform="translate(0, 128)">
          <rect width="182" height="58" rx="6" fill="#080c14" stroke="#172033" stroke-width="1" />
          <text x="14" y="20" class="font-mono" font-size="9" font-weight="600" fill="#64748b">PRECISION</text>
          <text x="14" y="44" class="font-sans" font-size="20" font-weight="800" fill="#ffffff">99.4% <tspan font-size="11" font-weight="600" fill="#10b981">mAP</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>
